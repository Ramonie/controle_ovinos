
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuário | AuctionEAJ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 700px;">

        <div class="card-header bg-success text-white p-3">
            <h4 class="mb-0">
                <i class="bi bi-person-gear me-2"></i>
                Editar cadastro de usuário
            </h4>
        </div>

        <div class="card-body p-4">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nome de usuário</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ usuario.username }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ usuario.email }}"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ profile.phone|default:'' }}"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de perfil</label>

                    <select name="role" class="form-select">
                        {% for valor, descricao in profile.get_role_choices %}
                            <option value="{{ valor }}"
                                {% if profile.role == valor %}selected{% endif %}>
                                {{ descricao }}
                            </option>
                        {% empty %}
                            <option value="visitor"
                                {% if profile.role == 'visitor' %}selected{% endif %}>
                                Visitante
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <hr>

                <div class="form-check form-switch mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="is_superuser"
                        id="is_superuser"
                        {% if usuario.is_superuser %}checked{% endif %}
                    >

                    <label class="form-check-label fw-semibold" for="is_superuser">
                        Conceder acesso de superusuário
                    </label>

                    <div class="form-text">
                        O superusuário possui acesso administrativo completo ao Django.
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'perfil' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                        Voltar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i>
                        Salvar alterações
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
